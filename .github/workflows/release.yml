name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Tag matches manifest version
        run: node -e "const v=require('./manifest.json').version;if('v'+v!==process.env.GITHUB_REF_NAME){console.error('tag '+process.env.GITHUB_REF_NAME+' != manifest v'+v);process.exit(1)}"
      - name: Build zip
        run: zip -r "kpn-factuur-grabber-${GITHUB_REF_NAME}.zip" manifest.json background.js lib content popup icons LICENSE PRIVACY.md
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" "kpn-factuur-grabber-${GITHUB_REF_NAME}.zip" --title "Factuur Grabber $GITHUB_REF_NAME" --generate-notes
